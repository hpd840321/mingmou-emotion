server:
  port: 8080

spring:
  application:
    name: emotion-platform
  datasource:
    url: jdbc:mysql://192.168.3.12:3307/emotion_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  data:
    dir: ../data
  scan:
    interval-ms: 300000
  external-push:
    enabled: false
    base-url: http://ylcs.htface.cn:33895
    page-id: Emotion
    camera-code: CAM_DEFAULT
    batch-size: 200

visionmind:
  api:
    base-url: ${VM_API_URL:http://localhost:8080}
  face:
    detect:
      path: /v1/face/detect
    attribute:
      path: /v1/face/attribute
    search:
      path: /v1/face/search
  facedb:
    register-path: /v1/facedb/register

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 50
        failure-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
