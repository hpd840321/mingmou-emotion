server:
  port: 8080

spring:
  application:
    name: emotion-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/emotion_platform
    username: emotion
    password: emotion
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 24
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  data:
    dir: ../data
  image:
    cropped-dir: emotion-platform/images/cropped
  scan:
    interval-ms: 300000
  face:
    confidence-threshold: 0.5
    min-face-width: 50
  clustering:
    qdrant-url: http://localhost:6333
    similarity-threshold: 0.85
    min-cluster-size: 5
    min-confidence: 0.5
    min-face-width: 50
  external-push:
    enabled: false
    base-url: http://ylcs.htface.cn:33895
    page-id: Emotion
    camera-code: CAM_DEFAULT
    batch-size: 200

visionmind:
  api:
    base-url: ${VM_API_URL:http://localhost:8080}
  face:
    detect:
      path: /v1/face/detect
      tile-width: 320
      tile-height: 320
    attribute:
      path: /v1/face/attribute
    search:
      path: /v1/face/search
  facedb:
    register-path: /v1/facedb/register

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 50
        failure-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
