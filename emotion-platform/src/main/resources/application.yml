server:
  port: 8080

spring:
  application:
    name: emotion-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/emotion_platform
    username: ${DB_USERNAME:emotion}
    password: ${DB_PASSWORD:emotion}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

ai:
  face-recognition:
    url: ${FACE_API_URL:http://localhost:8081}
    timeout: 10000
  emotion-recognition:
    url: ${EMOTION_API_URL:http://localhost:8082}
    timeout: 10000

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10m
