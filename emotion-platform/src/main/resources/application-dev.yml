server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/emotion_platform
    username: emotion
    password: emotion
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

app:
  data:
    dir: /media/zebra/data/官渡一中初一班-0526/data
  jwt:
    secret: "emotion-platform-dev-jwt-secret-key-2026-05-30"
    expiration-ms: 86400000
  face:
    confidence-threshold: 0.5
  clustering:
    qdrant-url: http://localhost:6333
    similarity-threshold: 0.85
    min-cluster-size: 8
    min-confidence: 0.5
    min-face-width: 50

visionmind:
  api:
    base-url: http://localhost:8080
