syntax = "proto3";

package visionmind.inference.v1;
option java_package = "com.craftlabs.visionmind.core.grpc.proto";
option java_outer_classname = "InferenceProto";
option java_multiple_files = true;

// Unified inference service interface — all model services implement this
service Detector {
  rpc Predict(InferenceRequest) returns (InferenceResponse);
}

service OcrService {
  rpc Predict(InferenceRequest) returns (InferenceResponse);
}

service FaceService {
  rpc Predict(InferenceRequest) returns (InferenceResponse);
  rpc Analyze(FaceAnalysisRequest) returns (FaceAnalysisResponse);
  rpc TileDetect(TileDetectRequest) returns (TileDetectResponse);
  rpc CompareFaces(FaceCompareRequest) returns (FaceCompareResponse);
  rpc SearchFaces(FaceSearchRequest) returns (FaceSearchResponse);
  rpc GetGpuMetrics(GpuMetricsRequest) returns (GpuMetricsResponse);
}

message GpuMetricsRequest {}

message GpuMetricsResponse {
  int32 gpu_id = 1;
  int32 mem_used_mb = 2;
  int32 mem_total_mb = 3;
  int32 gpu_util_pct = 4;
  int32 temperature_c = 5;
}

message InferenceRequest {
  string image_url = 1;
  map<string, string> params = 2;
  bytes extra_data = 3;
}

message InferenceResponse {
  bool success = 1;
  string result_json = 2;
  string error_message = 3;
}

// ============================================================
// FaceService — multi-attribute face analysis
// ============================================================

// ============================================================
// FaceService — multi-attribute face analysis + search
// ============================================================

// 1:1 face comparison
message FaceCompareRequest {
  string image_a = 1;
  string image_b = 2;
  float threshold = 3;
}
message FaceCompareResponse {
  bool is_match = 1;
  float similarity = 2;
  string error = 3;
}

// 1:N face search
message FaceSearchRequest {
  string image_url = 1;
  string library_id = 2;
  int32 top_k = 3;
  float threshold = 4;
}
message FaceSearchResponse {
  repeated FaceMatch matches = 1;
  string error = 2;
}
message FaceMatch {
  string face_id = 1;
  float similarity = 2;
  map<string,string> metadata = 3;
}

message FaceAnalysisRequest {
  string image_url = 1;
  bytes image_data = 2;
  int64 enabled_features = 3;
  map<string, string> params = 4;
}

message FaceAnalysisResponse {
  bool success = 1;
  string error_message = 2;
  repeated FaceResult faces = 3;
}

message FaceResult {
  FaceBasicToken token = 1;
  FaceEulerAngle angle = 2;
  FaceAttribute attribute = 3;
  FaceEmotion emotion = 4;
  float quality = 5;
  bool mask = 6;
  float liveness = 7;
  FaceInteraction interaction = 8;
  bytes feature = 9;
}

message FaceBasicToken {
  int32 track_id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  float confidence = 6;
}

message FaceEulerAngle {
  float roll = 1;
  float yaw = 2;
  float pitch = 3;
}

message FaceAttribute {
  int32 race = 1;
  int32 gender = 2;
  int32 age_bracket = 3;
}

message FaceEmotion {
  int32 emotion = 1;
  repeated float probabilities = 2;  // 8-class softmax output from EmotiEffLib
  string label = 3;                  // Chinese label for top emotion
}

// ============================================================
// EmotionService — standalone emotion recognition (EmotiEffLib TRT)
// ============================================================

service EmotionService {
  rpc Predict(EmotionRequest) returns (EmotionResponse);
}

message EmotionRequest {
  bytes image_data = 1;  // JPEG-encoded face crop
}

message EmotionResponse {
  bool success = 1;
  string error_message = 2;
  FaceEmotion emotion = 3;
}

// ============================================================
// AttributeService — standalone gender/age (GenderAge TRT)
// ============================================================

service AttributeService {
  rpc Predict(AttributeRequest) returns (AttributeResponse);
}

message AttributeRequest {
  bytes image_data = 1;  // JPEG-encoded face crop
}

message AttributeResponse {
  bool success = 1;
  string error_message = 2;
  int32 gender = 3;       // 0=female, 1=male
  int32 age = 4;          // age in years
  string age_bracket = 5; // "0-18" | "19-35" | "36-55" | "56+"
}

message FaceInteraction {
  float left_eye_open = 1;
  float right_eye_open = 2;
  int32 action = 3;
}

// ============================================================
// TileDetect — tile-based face detection for large images
// ============================================================

message TileDetectRequest {
  string image_url = 1;
  bytes image_data = 2;
  int32 tile_width = 3;
  int32 tile_height = 4;
  float overlap_ratio = 5;
  float confidence_threshold = 6;
  float nms_threshold = 7;
  int64 enabled_features = 8;
}

message TileDetectResponse {
  bool success = 1;
  string error_message = 2;
  repeated FaceResult faces = 3;
  TileInfo tile_info = 4;
}

message TileInfo {
  int32 original_width = 1;
  int32 original_height = 2;
  int32 tile_width = 3;
  int32 tile_height = 4;
  float overlap_ratio = 5;
  int32 tiles_x = 6;
  int32 tiles_y = 7;
  int32 total_tiles = 8;
}
